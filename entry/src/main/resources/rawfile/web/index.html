<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebGL Test</title>
<style>
  * { margin:0; padding:0; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0a0a1a; }
  #status { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            color:#d4b678; font:18px sans-serif; text-align:center; }
</style>
</head>
<body>
<div id="status">Testing WebGL...</div>

<script>
(function(){
  var s = document.getElementById('status');

  // Test 1: Does canvas exist?
  var canvas = document.createElement('canvas');
  if (!canvas) { s.textContent = 'FAIL: no canvas'; return; }

  // Test 2: Get WebGL context
  var gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
  if (!gl) { s.textContent = 'FAIL: no WebGL context'; return; }

  // Test 3: Create shaders
  var vs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs, 'attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}');
  gl.compileShader(vs);
  if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) {
    s.textContent = 'FAIL: vertex shader';
    return;
  }

  var fs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs, 'precision mediump float;void main(){gl_FragColor=vec4(0.83,0.72,0.47,1);}');
  gl.compileShader(fs);
  if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) {
    s.textContent = 'FAIL: fragment shader';
    return;
  }

  // Test 4: Create program
  var prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    s.textContent = 'FAIL: program link';
    return;
  }

  // Test 5: Create buffer + draw
  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0,1, -1,-1, 1,-1]), gl.STATIC_DRAW);

  var loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  gl.viewport(0, 0, canvas.width, canvas.height);

  gl.clearColor(0.04, 0.04, 0.10, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);

  gl.useProgram(prog);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  document.body.appendChild(canvas);

  var info = 'WebGL OK!\n';
  info += 'Renderer: ' + gl.getParameter(gl.RENDERER) + '\n';
  info += 'Vendor: ' + gl.getParameter(gl.VENDOR) + '\n';
  info += 'Version: ' + gl.getParameter(gl.VERSION) + '\n';
  info += 'Max texture: ' + gl.getParameter(gl.MAX_TEXTURE_SIZE);
  s.style.whiteSpace = 'pre-line';
  s.textContent = info;
})();
</script>
</body>
</html>
