<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exhibition Simulator</title>
<style>
  *{margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1a}
  #loader{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
          color:#d4b678;font:18px sans-serif;text-align:center}
  #info{position:absolute;top:10px;left:10px;color:#6a6;font:11px monospace;white-space:pre-wrap;max-width:90%}
</style>
</head>
<body>
<div id="loader">Loading...</div>
<div id="info"></div>

<script src="js/gltf_data.js"></script>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const L=document.getElementById('loader');
const I=document.getElementById('info');
function log(m){I.textContent+=m+'\n';L.textContent=m}
function err(m){I.textContent+='ERR: '+m+'\n';L.textContent='ERR: '+m;L.style.color='#ff6b6b'}

log('Parsing glTF...');
const loader=new GLTFLoader;
loader.parse(JSON.stringify(window.GLTF_DATA),'',function(gltf){
  L.style.display='none';
  log('Scene loaded!');

  const scene=new THREE.Scene;
  scene.background=new THREE.Color(0x0a0a1a);

  const cam=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,100);
  cam.position.set(0,1.65,3.5);

  const r=new THREE.WebGLRenderer({antialias:true});
  r.setSize(innerWidth,innerHeight);
  r.setPixelRatio(devicePixelRatio);
  document.body.appendChild(r.domElement);

  scene.add(new THREE.AmbientLight(0xffffff,2));
  const k=new THREE.DirectionalLight(0xfff5e6,10);k.position.set(5,8,0);scene.add(k);
  const f=new THREE.DirectionalLight(0xb3c7f0,5);f.position.set(-5,3,5);scene.add(f);
  const ri=new THREE.DirectionalLight(0xfff5e6,4);ri.position.set(0,2,-5);scene.add(ri);

  scene.add(gltf.scene);

  // Log slots
  let slotCount=0;
  gltf.scene.traverse(function(n){if(n.name&&n.name.startsWith('Slot_')){log('Slot: '+n.name);slotCount++}});
  log('Total slots: '+slotCount);

  // FPS state
  const st={yaw:0,pitch:0,mx:0,my:0,keys:{}};

  function loop(){
    requestAnimationFrame(loop);
    const cp=Math.cos(st.pitch),sp=Math.sin(st.pitch),sy=Math.sin(st.yaw),cy=Math.cos(st.yaw);
    if(st.my||st.mx){cam.position.x+=(-sy*st.my*0.05+cy*st.mx*0.04);cam.position.z+=(-cy*st.my*0.05-sy*st.mx*0.04)}
    cam.lookAt(cam.position.x+sy*cp,cam.position.y-sp,cam.position.z-cy*cp);
    r.render(scene,cam);
  }
  loop();

  // Touch
  let drag=0,lx=0,ly=0;
  r.domElement.addEventListener('pointerdown',function(e){drag=1;lx=e.clientX;ly=e.clientY});
  window.addEventListener('pointerup',function(){drag=0});
  window.addEventListener('pointermove',function(e){if(!drag)return;st.yaw-=(e.clientX-lx)*0.004;st.pitch-=(e.clientY-ly)*0.004;lx=e.clientX;ly=e.clientY});
  window.addEventListener('keydown',function(e){st.keys[e.key]=1});
  window.addEventListener('keyup',function(e){st.keys[e.key]=0});
  setInterval(function(){st.mx=0;st.my=0;if(st.keys['w']||st.keys['ArrowUp'])st.my=1;if(st.keys['s']||st.keys['ArrowDown'])st.my=-1;if(st.keys['a']||st.keys['ArrowLeft'])st.mx=-1;if(st.keys['d']||st.keys['ArrowRight'])st.mx=1},16);

},function(e){err('Parse: '+(e.message||e))});
</script>
</body>
</html>
