<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Exhibition Simulator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1a;font-family:sans-serif;
  touch-action:none;-webkit-user-select:none;user-select:none}
#hotbar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;
  padding:8px 10px;background:rgba(26,26,46,0.85);border:1px solid rgba(212,182,120,0.3);
  border-radius:12px;z-index:10}
.hot-item{width:48px;height:44px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:rgba(26,26,46,0.8);
  border:1px solid rgba(80,80,100,0.3);overflow:hidden;transition:all 0.15s}
.hot-item img{width:44px;height:28px;object-fit:cover;border-radius:4px}
.hot-item .lbl{font-size:9px;color:#8a8a9a;margin-top:1px;max-width:46px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hot-item.sel{border:2px solid #d4b678;background:rgba(212,182,120,0.2);transform:translateY(-3px)}
.hot-item.sel .lbl{color:#f5e6c8}
.hot-item.up{border:1px dashed rgba(212,182,120,0.4);font-size:22px;color:#d4b678}
#cross{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(212,182,120,0.7);font-size:28px;z-index:5;pointer-events:none;display:none}
#place{position:fixed;top:62%;left:50%;transform:translateX(-50%);z-index:5;display:none;background:#d4b678;color:#0a0a1a;border:1px solid #d4b678;border-radius:22px;padding:10px 28px;font-size:16px;font-weight:bold;cursor:pointer}
#info{position:fixed;top:10px;left:10px;color:#6a6;font:10px monospace;white-space:pre-wrap;z-index:10;max-width:50%;pointer-events:none}
#joystick{position:fixed;left:28px;bottom:100px;z-index:10;opacity:0.6;pointer-events:auto;touch-action:none}
#tune{position:fixed;z-index:15;display:none;background:rgba(26,26,46,0.92);border:1px solid #d4b678;border-radius:10px;padding:10px 14px;min-width:180px;text-align:center}
#tune .title{color:#f5e6c8;font-size:13px;font-weight:bold;margin-bottom:8px}
#tune .row{display:flex;align-items:center;justify-content:center;gap:6px;margin:4px 0}
#tune .row span{color:#8a8a9a;font-size:11px;width:30px}
#tune button{background:rgba(30,30,50,0.8);border:1px solid rgba(212,182,120,0.4);color:#d4b678;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
#tune button.del{color:#ff6b6b;border-color:rgba(255,100,100,0.4)}
#tune button.done{background:#d4b678;color:#0a0a1a;border-color:#d4b678;padding:6px 16px;font-weight:bold}
#artCard{position:fixed;z-index:8;display:none;background:rgba(10,10,26,0.92);border:1px solid #d4b678;border-radius:10px;padding:8px 14px;color:#f5e6c8;font-size:12px;max-width:180px;text-align:center;pointer-events:none}
#artCard .t2{font-size:14px;font-weight:bold;color:#f5e6c8;margin-bottom:2px}
#artCard .a2{font-size:11px;color:#b9a57a}
#sceneSel{position:fixed;top:12px;left:12px;z-index:12;display:flex;gap:4px}
#sceneSel button{background:rgba(26,26,46,0.8);border:1px solid rgba(212,182,120,0.3);color:#8a8a9a;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer}
#sceneSel button.on{background:rgba(212,182,120,0.2);border-color:#d4b678;color:#d4b678}
</style>
</head>
<body>

<div id="sceneSel"><button class="on" data-scene="white_cube">白立方</button><button data-scene="salon_carre">Salon Carré</button><button id="btnExport">导出</button><button id="btnImport">导入</button></div>
<input type="file" id="fileImport" accept=".json" style="display:none">
<div id="hotbar"><div class="hot-item up">＋</div></div>
<div id="artCard"><div class="t2"></div><div class="a2"></div></div>
<div id="cross">＋</div>
<button id="place">放置</button>
<div id="info"></div>
<div id="tune"><div class="title"></div><div class="row"><span>水平</span><button>-1cm</button><button>+1cm</button></div><div class="row"><span>垂直</span><button>-1cm</button><button>+1cm</button></div><div class="row"><span>缩放</span><button>-10%</button><button>+10%</button></div><div class="row"><button class="del">移除</button><button class="done">完成</button></div></div>
<canvas id="joystick" width="140" height="140"></canvas>

<script src="js/gltf_data.js"></script>
<script src="js/gltf_salon.js"></script>
<script src="js/thumbnails.js"></script>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/loaders/GLTFLoader.js":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js"}}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const I=document.getElementById('info');function log(m){I.textContent+=m+'\n'}
document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault()},{passive:false});
log('Module loaded. THREE v'+THREE.REVISION);

// Data
const ARTWORKS=[
  {id:'mona_lisa',title:'蒙娜丽莎',artist:'Leonardo',rw:77,rh:53,desc:'晕染法调和了皮肤与空气的边界。她在看谁？没有人知道。'},
  {id:'starry_night',title:'星月夜',artist:'van Gogh',rw:921,rh:737,desc:'漩涡般的夜空下，丝柏树如火焰升腾。梵高在圣雷米病房的窗外看见了宇宙。'},
  {id:'birth_of_venus',title:'维纳斯诞生',artist:'Botticelli',rw:1725,rh:2785,desc:'美之女神从贝壳上升起。风神吹送，春神迎接。古典神话的重生。'},
  {id:'school_of_athens',title:'雅典学院',artist:'Raphael',rw:500,rh:770,desc:'柏拉图指向天空，亚里士多德指向大地。整个西方思想史被定格为一次会议。'},
  {id:'creation_of_adam',title:'创造亚当',artist:'Michelangelo',rw:280,rh:570,desc:'即将相触的两根手指之间，留出了美术史上最有名的一厘米空隙。'},
  {id:'primavera',title:'春',artist:'Primavera',rw:203,rh:314,desc:'维纳斯、三女神、墨丘利在橙树林里组成缓慢的舞步。五百种植物被精准描绘。'}
];
const WALLS=[{n:[0,0,1],p:[0,0,-5],min:-7.5,max:7.5},{n:[0,0,-1],p:[0,0,5],min:-7.5,max:7.5},{n:[-1,0,0],p:[7.5,0,0],min:-5,max:5},{n:[1,0,0],p:[-7.5,0,0],min:-5,max:5}];
function thumb(id){return window.THUMBS&&window.THUMBS[id]?window.THUMBS[id]:''}
let selectedArt=null,placement=0,artworks=[];

// Scene
const scene=new THREE.Scene;scene.background=new THREE.Color(0x8899bb);
const cam=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,100);cam.position.set(0,1.65,3.5);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

// Lights
const ambient=new THREE.AmbientLight(0xC8C0B8,1.8);scene.add(ambient);
const sun=new THREE.DirectionalLight(0xFFF5E6,8);sun.position.set(5,6,0);scene.add(sun);
const fillL=new THREE.DirectionalLight(0xB0C0E0,3.5);fillL.position.set(-5,3,4);scene.add(fillL);
const rimL=new THREE.DirectionalLight(0xFFF0E0,2.5);rimL.position.set(0,2,-5);scene.add(rimL);

// Grid + cube (visible immediately)
const grid=new THREE.GridHelper(12,12,0x888888,0x333333);scene.add(grid);
const testCube=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({color:0xd4b678}));testCube.position.set(0,1,-3);scene.add(testCube);
log('Grid+cube added');

// Day cycle
let dayTime=0.5,daySpeed=0.05,dayPaused=false,savedSpeed=0.05;
const DAY_COLORS=[
  {t:0.00,sky:'#050510',sun:'#334488',amb:'#111122',ambI:0.15,sunI:0.8,fillI:0.4,rimI:0.3},
  {t:0.08,sky:'#1a1a33',sun:'#ff6633',amb:'#332211',ambI:0.5,sunI:2.5,fillI:1.0,rimI:0.8},
  {t:0.25,sky:'#6688aa',sun:'#fff5e6',amb:'#999088',ambI:2.0,sunI:8.0,fillI:3.5,rimI:2.5},
  {t:0.50,sky:'#99aabb',sun:'#ffffff',amb:'#c8c0b8',ambI:3.5,sunI:12.0,fillI:4.5,rimI:3.0},
  {t:0.70,sky:'#778899',sun:'#ffe0c0',amb:'#b0a898',ambI:2.5,sunI:7.0,fillI:3.0,rimI:2.5},
  {t:0.85,sky:'#332211',sun:'#ff4411',amb:'#221108',ambI:0.8,sunI:3.0,fillI:1.5,rimI:1.0},
  {t:0.95,sky:'#0a0a18',sun:'#224466',amb:'#0a0a18',ambI:0.3,sunI:1.2,fillI:0.6,rimI:0.5},
  {t:1.00,sky:'#050510',sun:'#334488',amb:'#111122',ambI:0.15,sunI:0.8,fillI:0.4,rimI:0.3}
];
function h2rgb(h){return [parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255]}
function l3(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}
function rgb2h(rgb){const r=Math.round(rgb[0]*255),g=Math.round(rgb[1]*255),b=Math.round(rgb[2]*255);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}

function updateDayCycle(dt){
  dayTime+=dt*daySpeed;if(dayTime>1)dayTime-=1;
  let i0=0,i1=1;for(let i=0;i<DAY_COLORS.length-1;i++){if(dayTime>=DAY_COLORS[i].t&&dayTime<DAY_COLORS[i+1].t){i0=i;i1=i+1;break}}
  const c0=DAY_COLORS[i0],c1=DAY_COLORS[i1],tt=(dayTime-c0.t)/(c1.t-c0.t);
  const skyR=l3(h2rgb(c0.sky),h2rgb(c1.sky),tt);scene.background=new THREE.Color(rgb2h(skyR));
  const sunR=l3(h2rgb(c0.sun),h2rgb(c1.sun),tt);sun.color.setRGB(sunR[0],sunR[1],sunR[2]);
  sun.intensity=c0.sunI+(c1.sunI-c0.sunI)*tt;ambient.intensity=c0.ambI+(c1.ambI-c0.ambI)*tt;
  fillL.intensity=c0.fillI+(c1.fillI-c0.fillI)*tt;rimL.intensity=c0.rimI+(c1.rimI-c0.rimI)*tt;
  const elev=(dayTime-0.25)*Math.PI*2,az=dayTime*Math.PI*2;
  sun.position.set(Math.cos(elev)*Math.sin(az)*12,Math.sin(elev)*12,Math.cos(elev)*Math.cos(az)*12);
}
function timeLabel(){const el=document.getElementById('tLabel');if(!el)return;const h=Math.floor(dayTime*24),m=Math.floor((dayTime*24-h)*60);const s=h.toString().padStart(2,'0')+':'+m.toString().padStart(2,'0');if(h<6||h>=22)el.textContent='Night '+s;else if(h<10)el.textContent='Dawn '+s;else if(h<17)el.textContent='Day '+s;else el.textContent='Dusk '+s}

// Ghost + shadow
const ghost=new THREE.Mesh(new THREE.PlaneGeometry(1.2,0.9),new THREE.MeshBasicMaterial({color:0xd4b678,transparent:true,opacity:0.3,side:THREE.DoubleSide}));ghost.visible=false;scene.add(ghost);
const shC=document.createElement('canvas');shC.width=64;shC.height=64;const shX=shC.getContext('2d');const g=shX.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(0,0,0,0.4)');g.addColorStop(0.4,'rgba(0,0,0,0.15)');g.addColorStop(1,'rgba(0,0,0,0)');shX.fillStyle=g;shX.fillRect(0,0,64,64);
const shadowDisc=new THREE.Mesh(new THREE.PlaneGeometry(0.5,0.5),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(shC),transparent:true,depthWrite:false,side:THREE.DoubleSide}));shadowDisc.rotation.x=-Math.PI/2;scene.add(shadowDisc);

// Audio
let ac=null;function ia(){if(!ac)try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function pf(){if(!ac)return;const t=ac.currentTime,b=ac.createBuffer(1,ac.sampleRate*0.1,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.25;const n=ac.createBufferSource();n.buffer=b;const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1600;bp.Q.value=1.5;const g=ac.createGain();g.gain.setValueAtTime(0.07,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.08);n.connect(bp);bp.connect(g);g.connect(ac.destination);n.start(t);n.stop(t+0.1)}
function pp(){if(!ac)return;const t=ac.currentTime,o=ac.createOscillator();o.type='triangle';o.frequency.setValueAtTime(330,t);o.frequency.linearRampToValueAtTime(550,t+0.12);const g=ac.createGain();g.gain.setValueAtTime(0.12,t);g.gain.linearRampToValueAtTime(0,t+0.15);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+0.15)}
let lastSpoke='';function speak(text){if(!text||text===lastSpoke)return;lastSpoke=text;try{const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=0.85;u.pitch=1.1;u.volume=0.7;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

// Joystick
const jc=document.getElementById('joystick'),jctx=jc.getContext('2d'),jcx=70,jcy=70,jr=56;let jid=null,jbx=70,jby=70;
function dj(){jctx.clearRect(0,0,140,140);jctx.beginPath();jctx.arc(jcx,jcy,jr,0,6.28);jctx.strokeStyle='rgba(212,182,120,0.35)';jctx.lineWidth=2.5;jctx.stroke();jctx.beginPath();jctx.arc(jbx,jby,24,0,6.28);jctx.fillStyle='rgba(212,182,120,0.45)';jctx.fill()}dj();
let jrX=0,jrY=0,jm={fwd:0,str:0};
jc.addEventListener('pointerdown',function(e){ia();jid=e.pointerId;jc.setPointerCapture(jid)});
jc.addEventListener('pointermove',function(e){if(e.pointerId!==jid)return;const r=jc.getBoundingClientRect(),dx=(e.clientX-r.left)-jcx,dy=(e.clientY-r.top)-jcy,m=Math.sqrt(dx*dx+dy*dy),c=Math.min(m,jr)/Math.max(m,0.01);jbx=jcx+dx*c;jby=jcy+dy*c;jrX=dx/jr;jrY=dy/jr;dj()});
jc.addEventListener('pointerup',ej);jc.addEventListener('pointerleave',ej);
function ej(){jid=null;jbx=jcx;jby=jcy;jrX=0;jrY=0;jm.fwd=0;jm.str=0;dj()}
function pj(){const m=Math.sqrt(jrX*jrX+jrY*jrY);if(m<0.1){jm.fwd=0;jm.str=0;return}const nx=jrX/m,ny=jrY/m,e=Math.pow(Math.min(m,1),1.5);jm.fwd=-ny*e*3.0;jm.str=nx*e*2.0}

// Texture cache
const texCache={};let slots3D=[];
ARTWORKS.forEach(function(a){const s=thumb(a.id);if(!s)return;const img=new Image;img.src=s;img.onload=function(){const t=new THREE.Texture(img);t.needsUpdate=true;t.colorSpace=THREE.SRGBColorSpace;t.wrapS=THREE.ClampToEdgeWrapping;t.wrapT=THREE.ClampToEdgeWrapping;t.minFilter=THREE.LinearFilter;t.magFilter=THREE.LinearFilter;texCache[a.id]=t}});

// Load scene
let currentScene='white_cube',gltfRoot=null,started=false;
let BOUNDS={xMin:-6.8,xMax:6.8,zMin:-4.3,zMax:4.3};
const SC={salon_carre:{walls:[{n:[0,0,1],p:[0,0,-5],min:-15,max:15},{n:[0,0,-1],p:[0,0,5],min:-15,max:15},{n:[-1,0,0],p:[15,0,0],min:-5,max:5},{n:[1,0,0],p:[-15,0,0],min:-5,max:5}],bounds:{xMin:-14.5,xMax:14.5,zMin:-4.3,zMax:4.3}}};

function loadScene(id){
  if(gltfRoot){scene.remove(gltfRoot);gltfRoot=null}
  artworks.forEach(function(q){scene.remove(q)});artworks=[];slots3D=[];placement=0;
  currentScene=id;const raw=id==='salon_carre'?window.GLTF_SALON_CARRE:window.GLTF_DATA;
  if(!raw){log('ERROR: no data for '+id);return}
  document.querySelectorAll('#sceneSel button').forEach(function(b){b.classList.toggle('on',b.dataset.scene===id)});
  try{
    new GLTFLoader().parse(JSON.stringify(raw),'',function(gltf){gltfRoot=gltf.scene;scene.add(gltfRoot);testCube.visible=false;
      gltf.scene.traverse(function(n){if(n.name&&n.name.startsWith('Slot_Painting_')){const w=new THREE.Vector3;n.getWorldPosition(w);slots3D.push({name:n.name,pos:w.clone(),w:1.2,h:0.9})}});
      log('Scene: '+id+' - '+slots3D.length+' slots');
      if(id==='salon_carre'){const sc=SC.salon_carre;WALLS.length=0;sc.walls.forEach(function(w){WALLS.push(w)});Object.assign(BOUNDS,sc.bounds)}
      if(!started){started=true;startUI()}
    },function(e){log('Parse error: '+(e.message||e))});
  }catch(e){log('Load error: '+(e.message||e))}
}

document.querySelectorAll('#sceneSel button[data-scene]').forEach(function(b){b.onclick=function(){if(b.dataset.scene!==currentScene)loadScene(b.dataset.scene||'white_cube')}});
loadScene('white_cube');

// Export
document.getElementById('btnExport').onclick=function(){
  const data=[];artworks.forEach(function(q){data.push({id:q.userData.id,title:q.userData.title,artist:q.userData.artist,desc:q.userData.desc,x:q.position.x,y:q.position.y,z:q.position.z,qx:q.quaternion.x,qy:q.quaternion.y,qz:q.quaternion.z,qw:q.quaternion.w,scale:q.scale.x})});
  const json=JSON.stringify({sceneId:currentScene,placements:data},null,2);
  const blob=new Blob([json],{type:'application/json'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='exhibition_'+currentScene+'.json';a.click();URL.revokeObjectURL(url);
  log('Exported '+data.length+' artworks')
};
document.getElementById('btnImport').onclick=function(){document.getElementById('fileImport').click()};
document.getElementById('fileImport').onchange=function(e){
  const file=e.target.files[0];if(!file)return;const reader=new FileReader;
  reader.onload=function(ev){try{const data=JSON.parse(ev.target.result);if(!data.placements)return;
    artworks.forEach(function(q){scene.remove(q)});artworks=[];
    data.placements.forEach(function(p){const geo=new THREE.PlaneGeometry(1.2,0.9);const tex2=texCache[p.id];let mat;if(tex2)mat=new THREE.MeshStandardMaterial({map:tex2,roughness:0.4,side:THREE.DoubleSide});else mat=new THREE.MeshStandardMaterial({color:0xd4b678,roughness:0.4,side:THREE.DoubleSide});const q=new THREE.Mesh(geo,mat);q.position.set(p.x,p.y,p.z);if(p.qx!==undefined)q.quaternion.set(p.qx,p.qy,p.qz,p.qw);q.userData={id:p.id,title:p.title,artist:p.artist,desc:p.desc};if(p.scale)q.scale.setScalar(p.scale);scene.add(q);artworks.push(q)});
    log('Imported '+data.placements.length+' artworks')
  }catch(err){log('Import error: '+err.message)}};
  reader.readAsText(file)
};

function startUI(){
  log('UI init');
  // Hotbar
  const hb=document.getElementById('hotbar');
  ARTWORKS.forEach(function(a){const d=document.createElement('div');d.className='hot-item';const s=thumb(a.id);d.innerHTML=s?('<img src="'+s+'" alt="'+a.title+'"/>'):('<div style="width:44px;height:28px;background:#4a4a5a;border-radius:4px"></div>');d.innerHTML+='<span class="lbl">'+a.title.substring(0,3)+'</span>';d.onclick=function(){sa(a,d)};hb.insertBefore(d,hb.lastElementChild)});
  function sa(a,d){ia();if(selectedArt&&selectedArt.id===a.id&&placement){placement=0;selectedArt=null;ui();return}selectedArt=a;placement=1;document.querySelectorAll('.hot-item').forEach(function(x){x.classList.remove('sel')});d.classList.add('sel');ui()}
  function ui(){document.getElementById('cross').style.display=placement?'block':'none';document.getElementById('place').style.display=placement&&ghost.visible?'block':'none'}
  document.getElementById('place').onclick=function(){if(!placement||!ghost.visible||!selectedArt)return;let w=ghost.userData&&ghost.userData.w?ghost.userData.w:1.2,h=ghost.userData&&ghost.userData.h?ghost.userData.h:0.9;let ratio=1;const tex2=texCache[selectedArt.id];if(tex2&&tex2.image&&tex2.image.width){ratio=tex2.image.width/tex2.image.height}else if(selectedArt.rw&&selectedArt.rh){ratio=selectedArt.rw/selectedArt.rh}const sr=w/h;if(ratio>sr)h=w/ratio;else w=h*ratio;const geo=new THREE.PlaneGeometry(w,h);let mat;const tex=texCache[selectedArt.id];if(tex)mat=new THREE.MeshStandardMaterial({map:tex,roughness:0.4,side:THREE.DoubleSide});else mat=new THREE.MeshStandardMaterial({color:0xd4b678,roughness:0.4,side:THREE.DoubleSide});const q=new THREE.Mesh(geo,mat);q.position.copy(ghost.position);q.quaternion.copy(ghost.quaternion);q.userData={id:selectedArt.id,title:selectedArt.title,artist:selectedArt.artist,desc:selectedArt.desc};scene.add(q);artworks.push(q);pp();log('Placed: '+selectedArt.title+' ('+artworks.length+')')};

  // Time UI
