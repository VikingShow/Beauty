<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exhibition Simulator</title>
<style>
  * { margin:0; padding:0; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0a0a1a; }
  #loader { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            color:#d4b678; font:18px sans-serif; text-align:center; }
  #info { position:absolute; top:10px; left:10px; color:#6a6; font:11px monospace;
           white-space:pre-wrap; max-width:90%; }
</style>
</head>
<body>
<div id="loader">Loading...</div>
<div id="info"></div>

<!-- GLTF data (embedded textures, sets window.GLTF_DATA) -->
<script src="js/gltf_data.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "./js/three.module.js",
    "three/addons/loaders/GLTFLoader.js": "./js/GLTFLoader.js"
  }
}
</script>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

  const loaderEl = document.getElementById('loader');
  const infoEl = document.getElementById('info');
  function info(msg) { infoEl.textContent += msg + '\n'; }

  // Use embedded glTF data (set by gltf_data.js)
  loaderEl.textContent = 'Parsing glTF...';
  const gltfData = window.GLTF_DATA;
  info('glTF: ' + (JSON.stringify(gltfData).length / 1024).toFixed(0) + 'KB');

  const loader = new GLTFLoader();
  loader.parse(JSON.stringify(gltfData), '', function(gltf) {
    loaderEl.style.display = 'none';
    initScene(gltf.scene);
  }, function(e) {
    loaderEl.textContent = 'Parse failed';
    info('Error: ' + (e.message || e));
  });

  function initScene(loadedScene) {
    info('Scene loaded!');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a1a);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.65, 3.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 2));
    const key = new THREE.DirectionalLight(0xfff5e6, 10);
    key.position.set(5, 8, 0); scene.add(key);
    const fill = new THREE.DirectionalLight(0xb3c7f0, 5);
    fill.position.set(-5, 3, 5); scene.add(fill);
    const rim = new THREE.DirectionalLight(0xfff5e6, 4);
    rim.position.set(0, 2, -5); scene.add(rim);

    scene.add(loadedScene);

    // Slot nodes
    const slots = [];
    loadedScene.traverse(function(node) {
      if (node.name && node.name.startsWith('Slot_')) {
        slots.push({ name: node.name, pos: node.position.clone() });
      }
    });
    info('Slots: ' + slots.length);
    for (let i = 0; i < slots.length; i++) {
      info('  ' + slots[i].name);
    }

    // FPS camera
    const state = { yaw:0, pitch:0, moveX:0, moveY:0, keys:{} };

    function animate() {
      requestAnimationFrame(animate);
      const yaw = state.yaw, pitch = Math.max(-1.5, Math.min(1.5, state.pitch));
      const cp = Math.cos(pitch), sp = Math.sin(pitch);
      if (state.moveY !== 0 || state.moveX !== 0) {
        camera.position.x += (-Math.sin(yaw)*state.moveY*0.05 + Math.cos(yaw)*state.moveX*0.04);
        camera.position.z += (-Math.cos(yaw)*state.moveY*0.05 - Math.sin(yaw)*state.moveX*0.04);
      }
      camera.lookAt(camera.position.x + Math.sin(yaw)*cp,
                    camera.position.y - sp,
                    camera.position.z - Math.cos(yaw)*cp);
      renderer.render(scene, camera);
    }
    animate();

    // Touch look
    let dragging=false, lx=0, ly=0;
    renderer.domElement.addEventListener('pointerdown', function(e){dragging=true;lx=e.clientX;ly=e.clientY;});
    window.addEventListener('pointerup', function(){dragging=false;});
    window.addEventListener('pointermove', function(e){
      if(!dragging)return;
      state.yaw-=(e.clientX-lx)*0.004;
      state.pitch-=(e.clientY-ly)*0.004;
      lx=e.clientX;ly=e.clientY;
    });

    // Keyboard
    window.addEventListener('keydown', function(e){state.keys[e.key]=true;});
    window.addEventListener('keyup', function(e){state.keys[e.key]=false;});
    setInterval(function(){
      state.moveX=0;state.moveY=0;
      if(state.keys['w']||state.keys['ArrowUp'])state.moveY=1;
      if(state.keys['s']||state.keys['ArrowDown'])state.moveY=-1;
      if(state.keys['a']||state.keys['ArrowLeft'])state.moveX=-1;
      if(state.keys['d']||state.keys['ArrowRight'])state.moveX=1;
    },16);
  }
</script>
</body>
</html>
