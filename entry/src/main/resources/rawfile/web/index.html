<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Exhibition Simulator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1a;font-family:sans-serif;
  touch-action:none;-webkit-user-select:none;user-select:none}
#hotbar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;
  padding:8px 10px;background:rgba(26,26,46,0.85);border:1px solid rgba(212,182,120,0.3);
  border-radius:12px;z-index:10}
.hot-item{width:48px;height:44px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:rgba(26,26,46,0.8);
  border:1px solid rgba(80,80,100,0.3);overflow:hidden;transition:all 0.15s}
.hot-item img{width:44px;height:28px;object-fit:cover;border-radius:4px}
.hot-item .lbl{font-size:9px;color:#8a8a9a;margin-top:1px;max-width:46px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hot-item.sel{border:2px solid #d4b678;background:rgba(212,182,120,0.2);transform:translateY(-3px)}
.hot-item.sel .lbl{color:#f5e6c8}
.hot-item.up{border:1px dashed rgba(212,182,120,0.4);font-size:22px;color:#d4b678}
#cross{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  color:rgba(212,182,120,0.7);font-size:28px;z-index:5;pointer-events:none;display:none}
#place{position:fixed;top:62%;left:50%;transform:translateX(-50%);z-index:5;display:none;
  background:#d4b678;color:#0a0a1a;border:1px solid #d4b678;border-radius:22px;padding:10px 28px;
  font-size:16px;font-weight:bold;cursor:pointer}
#info{position:fixed;top:10px;left:10px;color:#6a6;font:10px monospace;white-space:pre-wrap;z-index:10;max-width:50%;pointer-events:none}
#joystick{position:fixed;left:28px;bottom:100px;z-index:10;opacity:0.6;pointer-events:auto;touch-action:none}
#tune{position:fixed;z-index:15;display:none;background:rgba(26,26,46,0.92);border:1px solid #d4b678;border-radius:10px;
  padding:10px 14px;min-width:180px;text-align:center}
#tune .title{color:#f5e6c8;font-size:13px;font-weight:bold;margin-bottom:8px}
#tune .row{display:flex;align-items:center;justify-content:center;gap:6px;margin:4px 0}
#tune .row span{color:#8a8a9a;font-size:11px;width:30px}
#tune button{background:rgba(30,30,50,0.8);border:1px solid rgba(212,182,120,0.4);color:#d4b678;border-radius:6px;
  padding:4px 10px;font-size:12px;cursor:pointer}
#tune button.del{color:#ff6b6b;border-color:rgba(255,100,100,0.4)}
#tune button.done{background:#d4b678;color:#0a0a1a;border-color:#d4b678;padding:6px 16px;font-weight:bold}
#sceneSel{position:fixed;top:12px;left:12px;z-index:12;display:flex;gap:4px}
#sceneSel button{background:rgba(26,26,46,0.8);border:1px solid rgba(212,182,120,0.3);color:#8a8a9a;border-radius:6px;
  padding:4px 10px;font-size:11px;cursor:pointer}
#sceneSel button.on{background:rgba(212,182,120,0.2);border-color:#d4b678;color:#d4b678}
#timeUI{position:fixed;top:12px;right:12px;z-index:12;background:rgba(26,26,46,0.7);border:1px solid rgba(212,182,120,0.2);
  border-radius:6px;padding:4px 10px;color:#d4b678;font-size:11px;display:flex;align-items:center;gap:6px}
#timeUI button{background:none;border:none;color:#8a8a9a;font-size:12px;cursor:pointer;padding:0 2px}
#timeUI button.on{color:#d4b678}
</style>
</head>
<body>

<div id="sceneSel"><button class="on" data-scene="white_cube">白立方</button><button data-scene="salon_carre">Salon Carré</button></div>
<div id="timeUI"><button id="tSlower">◀◀</button><button id="tPause">⏯</button><span id="tLabel">上午</span><button id="tFaster">▶▶</button></div>
<div id="hotbar"><div class="hot-item up">＋</div></div>
<div id="cross">＋</div>
<button id="place">放置</button>
<div id="info"></div>
<div id="tune"><div class="title"></div><div class="row"><span>水平</span><button>-1cm</button><button>+1cm</button></div><div class="row"><span>垂直</span><button>-1cm</button><button>+1cm</button></div><div class="row"><span>缩放</span><button>-10%</button><button>+10%</button></div><div class="row"><button class="del">移除</button><button class="done">完成</button></div></div>
<canvas id="joystick" width="140" height="140"></canvas>

<script src="js/gltf_data.js"></script>
<script src="js/gltf_salon.js"></script>
<script src="js/thumbnails.js"></script>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js",
"three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const I=document.getElementById('info');function log(m){I.textContent+=m+'\n'}
document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault()},{passive:false});

// Data
const ARTWORKS=[
  {id:'mona_lisa',title:'蒙娜丽莎',artist:'Leonardo',rw:77,rh:53},
  {id:'starry_night',title:'星月夜',artist:'van Gogh',rw:921,rh:737},
  {id:'birth_of_venus',title:'维纳斯诞生',artist:'Botticelli',rw:1725,rh:2785},
  {id:'school_of_athens',title:'雅典学院',artist:'Raphael',rw:500,rh:770},
  {id:'creation_of_adam',title:'创造亚当',artist:'Michelangelo',rw:280,rh:570},
  {id:'primavera',title:'春',artist:'Primavera',rw:203,rh:314}
];
const WALLS=[
  {n:[0,0,1],p:[0,0,-5],min:-7.5,max:7.5},
  {n:[0,0,-1],p:[0,0,5],min:-7.5,max:7.5},
  {n:[-1,0,0],p:[7.5,0,0],min:-5,max:5},
  {n:[1,0,0],p:[-7.5,0,0],min:-5,max:5}
];
function thumb(id){return window.THUMBS&&window.THUMBS[id]?window.THUMBS[id]:''}
let selectedArt=null,placement=0,artworks=[];

// === SCENE: elegant museum lighting ===
const scene=new THREE.Scene;
scene.background=new THREE.Color(0x181820);

const cam=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,100);
cam.position.set(0,1.65,3.5);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(devicePixelRatio);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
document.body.appendChild(renderer.domElement);

// Balanced gallery lighting
// === DAY/NIGHT CYCLE ===
let dayTime=0.35,daySpeed=0.03; // start at late morning, slow cycle (~3min full)
const ambient=new THREE.AmbientLight(0xC8C0B8,1.8);scene.add(ambient);
const sun=new THREE.DirectionalLight(0xFFF5E6,8);sun.position.set(5,6,0);scene.add(sun);
const fillL=new THREE.DirectionalLight(0xB0C0E0,3.5);fillL.position.set(-5,3,4);scene.add(fillL);
const rimL=new THREE.DirectionalLight(0xFFF0E0,2.5);rimL.position.set(0,2,-5);scene.add(rimL);

const DAY_COLORS=[
  {t:0.00,sky:'#0a0a18',sun:'#4466aa',amb:'#334466',ambI:0.5,sunI:1.5, fillI:1.0, rimI:0.8},  // midnight
  {t:0.08,sky:'#1a2a44',sun:'#ff8844',amb:'#665544',ambI:1.0,sunI:3.0, fillI:1.5, rimI:1.2},  // dawn
  {t:0.25,sky:'#8899bb',sun:'#fff5e6',amb:'#c8c0b8',ambI:2.5,sunI:8.0, fillI:3.5, rimI:2.5},  // morning
  {t:0.50,sky:'#aabbcc',sun:'#ffffff',amb:'#d0ccc8',ambI:3.5,sunI:10.0,fillI:4.0, rimI:3.0},  // noon
  {t:0.70,sky:'#8899aa',sun:'#ffe8d0',amb:'#c8c0b0',ambI:2.5,sunI:7.0, fillI:3.0, rimI:2.5},  // afternoon
  {t:0.85,sky:'#553322',sun:'#ff6633',amb:'#554433',ambI:1.5,sunI:4.0, fillI:2.0, rimI:1.5},  // dusk
  {t:0.95,sky:'#0f1525',sun:'#335588',amb:'#223344',ambI:0.8,sunI:2.0, fillI:1.2, rimI:1.0},  // night
  {t:1.00,sky:'#0a0a18',sun:'#4466aa',amb:'#334466',ambI:0.5,sunI:1.5, fillI:1.0, rimI:0.8},  // midnight again
];

function lerp3(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}
function hexToRGB(h){return [parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255]}
function rgbToHex(rgb){const r=Math.round(rgb[0]*255),g=Math.round(rgb[1]*255),b=Math.round(rgb[2]*255);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}

function updateDayCycle(dt){
  dayTime+=dt*daySpeed;if(dayTime>1)dayTime-=1;
  // Find surrounding keyframes
  let i0=0,i1=1;
  for(let i=0;i<DAY_COLORS.length-1;i++){if(dayTime>=DAY_COLORS[i].t&&dayTime<DAY_COLORS[i+1].t){i0=i;i1=i+1;break}}
  const c0=DAY_COLORS[i0],c1=DAY_COLORS[i1];
  const range=c1.t-c0.t,tt=(dayTime-c0.t)/range;

  // Interpolate
  const skyA=hexToRGB(c0.sky),skyB=hexToRGB(c1.sky);
  const skyRgb=lerp3(skyA,skyB,tt);scene.background=new THREE.Color(rgbToHex(skyRgb));

  const sunA=hexToRGB(c0.sun),sunB=hexToRGB(c1.sun);
  const sunRgb=lerp3(sunA,sunB,tt);sun.color.setRGB(sunRgb[0],sunRgb[1],sunRgb[2]);
  sun.intensity=c0.sunI+(c1.sunI-c0.sunI)*tt;
  ambient.intensity=c0.ambI+(c1.ambI-c0.ambI)*tt;
  fillL.intensity=c0.fillI+(c1.fillI-c0.fillI)*tt;
  rimL.intensity=c0.rimI+(c1.rimI-c0.rimI)*tt;

  // Sun position: orbits around scene
  const elev=(dayTime-0.25)*Math.PI*2; // -π/2 at midnight, +π/2 at noon
  const az=dayTime*Math.PI*2;
  const dist=12;
  sun.position.set(Math.cos(elev)*Math.sin(az)*dist, Math.sin(elev)*dist, Math.cos(elev)*Math.cos(az)*dist);
}

// Time UI controls
let dayPaused=false,savedSpeed=daySpeed;
const tLabel=document.getElementById('tLabel');
function timeLabel(){
  const h=Math.floor(dayTime*24),m=Math.floor((dayTime*24-h)*60);
  const str=h.toString().padStart(2,'0')+':'+m.toString().padStart(2,'0');
  if(h<6||h>=22)tLabel.textContent='Night '+str;
  else if(h<10)tLabel.textContent='Dawn '+str;
  else if(h<17)tLabel.textContent='Day '+str;
  else tLabel.textContent='Dusk '+str;
}
document.getElementById('tSlower').onclick=function(){daySpeed=Math.max(0.003,daySpeed/2)};
document.getElementById('tPause').onclick=function(){
  dayPaused=!dayPaused;
  if(dayPaused){savedSpeed=daySpeed;daySpeed=0}
  else{daySpeed=savedSpeed}
};
document.getElementById('tFaster').onclick=function(){daySpeed=Math.min(1,daySpeed*2)};

// Monkey-patch updateDayCycle to include time label
const _updateDayCycle=updateDayCycle;
updateDayCycle=function(dt){_updateDayCycle(dt);timeLabel()};

// Ghost preview
const ghost=new THREE.Mesh(
  new THREE.PlaneGeometry(1.2,0.9),
  new THREE.MeshBasicMaterial({color:0xd4b678,transparent:true,opacity:0.3,side:THREE.DoubleSide})
);ghost.visible=false;scene.add(ghost);

// Shadow disc
const shCanvas=document.createElement('canvas');shCanvas.width=64;shCanvas.height=64;
const shCtx=shCanvas.getContext('2d');
const grad=shCtx.createRadialGradient(32,32,0,32,32,32);
grad.addColorStop(0,'rgba(0,0,0,0.4)');grad.addColorStop(0.4,'rgba(0,0,0,0.15)');grad.addColorStop(1,'rgba(0,0,0,0)');
shCtx.fillStyle=grad;shCtx.fillRect(0,0,64,64);
const shadowDisc=new THREE.Mesh(
  new THREE.PlaneGeometry(0.5,0.5),
  new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(shCanvas),transparent:true,depthWrite:false,side:THREE.DoubleSide})
);shadowDisc.rotation.x=-Math.PI/2;scene.add(shadowDisc);

// === AUDIO ===
let audioCtx=null;
function initAudio(){if(!audioCtx)try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function playFootstep(){
  if(!audioCtx)return;const t=audioCtx.currentTime;
  const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*0.1,audioCtx.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.25;
  const n=audioCtx.createBufferSource();n.buffer=buf;
  const bp=audioCtx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1600;bp.Q.value=1.5;
  const g=audioCtx.createGain();g.gain.setValueAtTime(0.07,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.08);
  n.connect(bp);bp.connect(g);g.connect(audioCtx.destination);n.start(t);n.stop(t+0.1);
}
function playPlace(){
  if(!audioCtx)return;const t=audioCtx.currentTime;
  const o=audioCtx.createOscillator();o.type='triangle';o.frequency.setValueAtTime(330,t);o.frequency.linearRampToValueAtTime(550,t+0.12);
  const g=audioCtx.createGain();g.gain.setValueAtTime(0.12,t);g.gain.linearRampToValueAtTime(0,t+0.15);
  o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+0.15);
}

// === JOYSTICK: movement only (forward/back + strafe) ===
const jc=document.getElementById('joystick'),jctx=jc.getContext('2d');
const jcx=70,jcy=70,jr=56;let jid=null,jbx=70,jby=70;
function drawJoy(){jctx.clearRect(0,0,140,140);
  jctx.beginPath();jctx.arc(jcx,jcy,jr,0,6.28);jctx.strokeStyle='rgba(212,182,120,0.35)';jctx.lineWidth=2.5;jctx.stroke();
  jctx.beginPath();jctx.arc(jbx,jby,24,0,6.28);jctx.fillStyle='rgba(212,182,120,0.45)';jctx.fill()}
drawJoy();
let joyRaw={x:0,y:0},joyMove={fwd:0,str:0};
jc.addEventListener('pointerdown',function(e){initAudio();jid=e.pointerId;jc.setPointerCapture(jid)});
jc.addEventListener('pointermove',function(e){if(e.pointerId!==jid)return;
  const r=jc.getBoundingClientRect(),dx=(e.clientX-r.left)-jcx,dy=(e.clientY-r.top)-jcy;
  const mag=Math.sqrt(dx*dx+dy*dy),clamp=Math.min(mag,jr)/Math.max(mag,0.01);
  jbx=jcx+dx*clamp;jby=jcy+dy*clamp;joyRaw.x=dx/jr;joyRaw.y=dy/jr;drawJoy()});
jc.addEventListener('pointerup',endJoy);jc.addEventListener('pointerleave',endJoy);
function endJoy(){jid=null;jbx=jcx;jby=jcy;joyRaw.x=0;joyRaw.y=0;joyMove.fwd=0;joyMove.str=0;drawJoy()}
function processJoy(){
  const rx=joyRaw.x,ry=joyRaw.y,mag=Math.sqrt(rx*rx+ry*ry);
  if(mag<0.1){joyMove.fwd=0;joyMove.str=0;return}
  const normX=rx/mag,normY=ry/mag,eased=Math.pow(Math.min(mag,1),1.5);
  joyMove.fwd=-normY*eased*3.0;joyMove.str=normX*eased*2.0;
}

// Texture preload
const texCache={};let slots3D=[];
ARTWORKS.forEach(function(a){
  const src=thumb(a.id);if(!src)return;
  const img=new Image;img.src=src;img.onload=function(){
    const tex=new THREE.Texture(img);tex.needsUpdate=true;tex.colorSpace=THREE.SRGBColorSpace;
    tex.wrapS=THREE.ClampToEdgeWrapping;tex.wrapT=THREE.ClampToEdgeWrapping;
    tex.minFilter=THREE.LinearFilter;tex.magFilter=THREE.LinearFilter;
    texCache[a.id]=tex;
  };
});

// Scene switching
let currentScene='white_cube',gltfRoot=null;
const SCENE_CONFIG={
  white_cube:{walls:WALLS,bounds:{xMin:-6.8,xMax:6.8,zMin:-4.3,zMax:4.3}},
  salon_carre:{walls:[
    {n:[0,0,1],p:[0,0,-5],min:-15,max:15},{n:[0,0,-1],p:[0,0,5],min:-15,max:15},
    {n:[-1,0,0],p:[15,0,0],min:-5,max:5},{n:[1,0,0],p:[-15,0,0],min:-5,max:5}
  ],bounds:{xMin:-14.5,xMax:14.5,zMin:-4.3,zMax:4.3}}
};

function loadSceneData(id){
  // Clear old scene objects (glTF root + placed artworks)
  if(gltfRoot)scene.remove(gltfRoot);
  artworks.forEach(function(q){scene.remove(q)});
  artworks=[];slots3D=[];selectedMesh=null;hideTune();placement=0;
  currentScene=id;const data=id==='salon_carre'?window.GLTF_SALON_CARRE:window.GLTF_DATA;
  document.querySelectorAll('#sceneSel button').forEach(function(b){b.classList.toggle('on',b.dataset.scene===id)});

  new GLTFLoader().parse(JSON.stringify(data),'',function(gltf){
    gltfRoot=gltf.scene;scene.add(gltfRoot);
    gltf.scene.traverse(function(n){
      if(n.name&&n.name.startsWith('Slot_Painting_')){
        const wp=new THREE.Vector3;n.getWorldPosition(wp);
        slots3D.push({name:n.name,pos:wp.clone(),w:1.2,h:0.9});
      }
    });
    log('Scene: '+id+' - '+slots3D.length+' slots');
    const cfg=SCENE_CONFIG[id]||SCENE_CONFIG.white_cube;
    WALLS.length=0;cfg.walls.forEach(function(w){WALLS.push(w)});
    Object.assign(BOUNDS,cfg.bounds);
    if(!started){started=true;start()}
  });
}

// Scene selector buttons
document.querySelectorAll('#sceneSel button').forEach(function(b){
  b.onclick=function(){if(b.dataset.scene!==currentScene)loadSceneData(b.dataset.scene||'white_cube')};
});

// Initial load
let started=false;
loadSceneData('white_cube');

function start(){
  // Hotbar
  const hb=document.getElementById('hotbar');
  ARTWORKS.forEach(function(a){
    const d=document.createElement('div');d.className='hot-item';
    const src=thumb(a.id);d.innerHTML=src?('<img src="'+src+'" alt="'+a.title+'"/>'):('<div style="width:44px;height:28px;background:#4a4a5a;border-radius:4px"></div>');
    d.innerHTML+='<span class="lbl">'+a.title.substring(0,3)+'</span>';d.onclick=function(){selectArt(a,d)};hb.insertBefore(d,hb.lastElementChild);
  });
  function selectArt(a,d){initAudio();
    if(selectedArt&&selectedArt.id===a.id&&placement){placement=0;selectedArt=null;updateUI();return}
    selectedArt=a;placement=1;document.querySelectorAll('.hot-item').forEach(function(x){x.classList.remove('sel')});d.classList.add('sel');updateUI()}
  function updateUI(){document.getElementById('cross').style.display=placement?'block':'none';document.getElementById('place').style.display=placement&&ghost.visible?'block':'none'}
  document.getElementById('place').onclick=function(){
    if(!placement||!ghost.visible||!selectedArt)return;

    // Compute artwork size fitting inside slot while maintaining aspect ratio
    const slotW=ghost.userData?.w||1.2, slotH=ghost.userData?.h||0.9;
    let artW=slotW, artH=slotH;
    if(selectedArt.rw&&selectedArt.rh){
      const artRatio=selectedArt.rw/selectedArt.rh;
      const slotRatio=slotW/slotH;
      if(artRatio>slotRatio){artW=slotW;artH=slotW/artRatio}
      else{artH=slotH;artW=slotH*artRatio}
    }

    const geo=new THREE.PlaneGeometry(artW,artH);
    let mat;
    const tex=texCache[selectedArt.id];
    if(tex){mat=new THREE.MeshStandardMaterial({map:tex,roughness:0.4,side:THREE.DoubleSide})}
    else{mat=new THREE.MeshStandardMaterial({color:0xd4b678,roughness:0.4,side:THREE.DoubleSide})}
    const q=new THREE.Mesh(geo,mat);
    q.position.copy(ghost.position);q.quaternion.copy(ghost.quaternion);
    q.userData={id:selectedArt.id,title:selectedArt.title};
    scene.add(q);artworks.push(q);playPlace();log('Placed: '+selectedArt.title+' ('+artworks.length+')')};

  // === FINE-TUNE: select placed artwork via raycaster ===
  const tuneRay=new THREE.Raycaster;tuneRay.far=10;
  let selectedMesh=null,tune=document.getElementById('tune');
  const tuneTitle=tune.querySelector('.title');
  const tuneBtns=tune.querySelectorAll('button');

  function hideTune(){selectedMesh=null;tune.style.display='none'}
  // Tune button bindings: -1cm H, +1cm H, -1cm V, +1cm V, -10%, +10%, remove, done
  tuneBtns[0].onclick=function(){if(selectedMesh)nudgeMesh(selectedMesh,-0.01,0)};
  tuneBtns[1].onclick=function(){if(selectedMesh)nudgeMesh(selectedMesh,0.01,0)};
  tuneBtns[2].onclick=function(){if(selectedMesh)nudgeMesh(selectedMesh,0,-0.01)};
  tuneBtns[3].onclick=function(){if(selectedMesh)nudgeMesh(selectedMesh,0,0.01)};
  tuneBtns[4].onclick=function(){if(selectedMesh)scaleMesh(selectedMesh,0.9)};
  tuneBtns[5].onclick=function(){if(selectedMesh)scaleMesh(selectedMesh,1.1)};
  tuneBtns[6].onclick=function(){if(selectedMesh){scene.remove(selectedMesh);artworks=artworks.filter(function(x){return x!==selectedMesh});hideTune()}};
  tuneBtns[7].onclick=hideTune;

  function nudgeMesh(m,dx,dy){
    const n=new THREE.Vector3(0,0,1);n.applyQuaternion(m.quaternion).normalize();
    m.position.x+=n.x*dx+n.z*dy;m.position.y+=dy;
    updateTunePos(m);
  }
  function scaleMesh(m,factor){m.scale.multiplyScalar(factor);updateTunePos(m)}
  function updateTunePos(m){
    const v=new THREE.Vector3;m.getWorldPosition(v);
    v.project(cam);const sx=(v.x*0.5+0.5)*innerWidth,sy=(-v.y*0.5+0.5)*innerHeight;
    tune.style.left=Math.min(sx+30,innerWidth-200)+'px';
    tune.style.top=Math.max(sy-60,10)+'px';
    tuneTitle.textContent=m.userData?.title||'画作';
  }

  // Click to select placed artwork
  renderer.domElement.addEventListener('click',function(e){
    if(placement||drag)return; // don't select while placing or rotating
    const mx=(e.clientX/innerWidth)*2-1,my=-(e.clientY/innerHeight)*2+1;
    tuneRay.setFromCamera(new THREE.Vector2(mx,my),cam);
    const hits=tuneRay.intersectObjects(artworks);
    if(hits.length>0){selectedMesh=hits[0].object;updateTunePos(selectedMesh);tune.style.display='block'}
    else{hideTune()}
  });

  // Game loop
  let BOUNDS={xMin:-6.8,xMax:6.8,zMin:-4.3,zMax:4.3};
  const st={yaw:0,pitch:0,bobPhase:0,isMoving:false,stepTimer:0,keys:{}};
  let lastT=performance.now();

  function loop(now){
    requestAnimationFrame(loop);
    let dt=(now-lastT)/1000;lastT=now;if(dt>0.05)dt=0.05;if(dt<=0)dt=0.016;
    updateDayCycle(dt);

    processJoy();

    const sinY=Math.sin(st.yaw),cosY=Math.cos(st.yaw),cp=Math.cos(st.pitch),sp=Math.sin(st.pitch);

    // Movement from joystick + keyboard
    let kf=0,ks=0;
    if(st.keys['w']||st.keys['ArrowUp'])kf=1;if(st.keys['s']||st.keys['ArrowDown'])kf=-1;
    if(st.keys['a']||st.keys['ArrowLeft'])ks=-1;if(st.keys['d']||st.keys['ArrowRight'])ks=1;
    const fwd=joyMove.fwd+kf*3,str=joyMove.str+ks*2;
    const moving=Math.abs(fwd)>0.01||Math.abs(str)>0.01;

    // Forward vector: at yaw=0, forward = -Z (facing north)
    if(moving){
      cam.position.x+=(sinY*fwd+cosY*str)*dt;
      cam.position.z+=(-cosY*fwd+sinY*str)*dt;
    }
    // Collision
    const R=0.3;cam.position.x=Math.max(BOUNDS.xMin+R,Math.min(BOUNDS.xMax-R,cam.position.x));
    cam.position.z=Math.max(BOUNDS.zMin+R,Math.min(BOUNDS.zMax-R,cam.position.z));

    // Bobbing
    if(moving){st.bobPhase+=dt*12;st.isMoving=true;st.stepTimer+=dt}
    else{st.bobPhase+=0;st.isMoving=false;st.stepTimer=0}
    const bobY=st.isMoving?Math.sin(st.bobPhase)*0.015:0;
    const bobX=st.isMoving?Math.cos(st.bobPhase*0.5)*0.005:0;
    if(st.stepTimer>0.5){st.stepTimer-=0.5;playFootstep()}

    // Shadow
    shadowDisc.position.set(cam.position.x,0.02,cam.position.z);

    // Camera
    const camY=1.65+bobY;
    cam.position.x+=bobX;cam.position.y=camY;
    // Look direction: yaw rotates around Y, pitch tilts up/down
    cam.lookAt(cam.position.x+sinY*cp,cam.position.y-sp,cam.position.z-cosY*cp);
    cam.position.x-=bobX;cam.position.y=1.65;

    // Raycaster ghost + slot snapping
    if(placement){
      const dir=cam.getWorldDirection(new THREE.Vector3);
      // First, find nearest slot that's in view
      let nearestSlot=null,nearestDist=2.5; // snap within 2.5m
      const camPos=cam.position;
      for(let i=0;i<slots3D.length;i++){
        const s=slots3D[i];const dx=s.pos.x-camPos.x,dz=s.pos.z-camPos.z;
        const dist=Math.sqrt(dx*dx+dz*dz);
        if(dist<nearestDist){
          // Check if slot is roughly in front of camera
          const dot=dx*dir.x+dz*dir.z;
          if(dot>0){nearestDist=dist;nearestSlot=s}
        }
      }
      if(nearestSlot){
        // Snap ghost to slot, facing outward from wall
        const s=nearestSlot;
        ghost.position.copy(s.pos);
        // Determine wall normal from position
        let nx=0,nz=0;
        if(Math.abs(s.pos.z+5)<0.1){nx=0;nz=1}      // north wall → face +Z
        else if(Math.abs(s.pos.z-5)<0.1){nx=0;nz=-1} // south wall → face -Z
        else if(Math.abs(s.pos.x-7.5)<0.1){nx=-1;nz=0} // east wall → face -X
        else if(Math.abs(s.pos.x+7.5)<0.1){nx=1;nz=0}  // west wall → face +X
        ghost.position.x+=nx*0.005;ghost.position.z+=nz*0.005;
        // Face wall normal direction
        ghost.quaternion.setFromUnitVectors(
          new THREE.Vector3(0,0,1),new THREE.Vector3(nx,0,nz)
        );
        ghost.scale.set(s.w/1.2,s.h/0.9,1);
        ghost.userData={w:s.w,h:s.h};
        ghost.visible=true;document.getElementById('place').style.display='block';
      }else{
        // Fall back to raycast wall hit
        let best=null,bestD=5;
        WALLS.forEach(function(w){
          const d=dir.x*w.n[0]+dir.y*w.n[1]+dir.z*w.n[2];if(d>=-0.001)return;
          const t=((w.p[0]-camPos.x)*w.n[0]+(w.p[1]-camPos.y)*w.n[1]+(w.p[2]-camPos.z)*w.n[2])/d;
          if(t>0.01&&t<bestD){const hx=camPos.x+dir.x*t,hy=camPos.y+dir.y*t,hz=camPos.z+dir.z*t;
            if(hy<0.5||hy>4.5)return;const along=w.n[2]!==0?hx:hz;if(along<w.min||along>w.max)return;
            let overlap=0;artworks.forEach(function(q){const dx=hx-q.position.x,dz=hz-q.position.z;if(dx*dx+dz*dz<0.3)overlap=1});
            if(!overlap){best={x:hx,y:hy,z:hz,nx:w.n[0],nz:w.n[2]};bestD=t}}});
        if(best){ghost.position.set(best.x,best.y,best.z);
          ghost.quaternion.copy(cam.quaternion);ghost.position.x+=best.nx*0.01;ghost.position.z+=best.nz*0.01;
          ghost.scale.set(1,1,1);ghost.userData={w:1.2,h:0.9};
          ghost.visible=true;document.getElementById('place').style.display='block'}
        else{ghost.visible=false;document.getElementById('place').style.display='none'}
      }}
    else{ghost.visible=false;document.getElementById('place').style.display='none'}
    renderer.render(scene,cam);
  }
  lastT=performance.now();requestAnimationFrame(loop);

  // Touch look (RIGHT half of screen = look, LEFT joystick = move)
  let drag=0,lx=0,ly=0,pId=null;
  renderer.domElement.addEventListener('pointerdown',function(e){
    if(e.target===jc||jc.contains(e.target))return;
    initAudio();drag=1;lx=e.clientX;ly=e.clientY;pId=e.pointerId});
  window.addEventListener('pointerup',function(e){if(e.pointerId===pId){drag=0;pId=null}});
  window.addEventListener('pointermove',function(e){
    if(!drag||e.pointerId!==pId)return;
    st.yaw+=(e.clientX-lx)*0.005;
    st.pitch+=(e.clientY-ly)*0.005;
    st.pitch=Math.max(-1.4,Math.min(1.4,st.pitch));
    lx=e.clientX;ly=e.clientY});
  window.addEventListener('keydown',function(e){st.keys[e.key]=1;initAudio()});
  window.addEventListener('keyup',function(e){st.keys[e.key]=0});
}
</script>
</body>
</html>
