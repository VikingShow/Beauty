<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module Test</title>
<style>
  *{margin:0;padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1a;}
  #status{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
          color:#d4b678;font:18px sans-serif;text-align:center;white-space:pre-line;max-width:90%;}
</style>
</head>
<body>
<div id="status">Test 1: HTML loaded</div>

<!-- Test 1: gltf_data.js regular script -->
<script src="js/gltf_data.js"></script>
<script>
  var S = document.getElementById('status');
  function ok(m) { S.textContent += '\n' + m; }
  function fail(m) { S.textContent += '\n' + m; S.style.color = '#ff6b6b'; }

  if (window.GLTF_DATA) ok('Test 2: gltf_data.js OK (' + JSON.stringify(window.GLTF_DATA).length + ' chars)');
  else fail('Test 2: gltf_data.js FAILED');
</script>

<!-- Test 2: importmap -->
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<!-- Test 3: ESM import -->
<script type="module">
  import * as THREE from 'three';
  var S = document.getElementById('status');
  S.textContent += '\nTest 3: THREE imported v' + THREE.REVISION;

  // Quick render test: spinning gold cube + white floor
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a1a);

  var cam = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 100);
  cam.position.set(0, 2, 5);
  cam.lookAt(0, 0, 0);

  var r = new THREE.WebGLRenderer({antialias:true});
  r.setSize(window.innerWidth, window.innerHeight);
  r.setPixelRatio(devicePixelRatio);
  document.body.appendChild(r.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 2));
  var dl = new THREE.DirectionalLight(0xd4b678, 5);
  dl.position.set(3, 5, 3);
  scene.add(dl);

  var floor = new THREE.Mesh(
    new THREE.PlaneGeometry(15, 10),
    new THREE.MeshStandardMaterial({color:0xb4b2ae, roughness:0.3})
  );
  floor.rotation.x = -Math.PI/2;
  scene.add(floor);

  var geo = new THREE.BoxGeometry(1, 1, 1);
  var mat = new THREE.MeshStandardMaterial({color:0xd4b678, roughness:0.3, metalness:0.5});
  var cube = new THREE.Mesh(geo, mat);
  cube.position.y = 0.5;
  scene.add(cube);

  function loop() {
    requestAnimationFrame(loop);
    cube.rotation.y += 0.01;
    r.render(scene, cam);
  }
  loop();

  S.style.display = 'none';
</script>
</body>
</html>
